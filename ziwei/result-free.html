const cvs = document.getElementById('wave-canvas');
const ctx = cvs.getContext('2d');
let ph = 0, curHz = 400;
function resize(){ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
function lerpC(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&255,ag=(ah>>8)&255,ab=ah&255;
  const br=(bh>>16)&255,bg=(bh>>8)&255,bb=bh&255;
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}
function draw(){
  const t=Math.max(0,Math.min(1,(curHz-20)/980));
  const spd=.3+t*2.5,amp=40+t*60,frq=.003+t*.009;
  ph+=spd*.012;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const c1=lerpC('#1a0050','#3a10a0',t),c2=lerpC('#001040','#103080',t);
  for(let l=0;l<3;l++){
    const lp=ph+(l*Math.PI*.6),la=amp*(1-l*.25),al=.55-l*.13;
    ctx.beginPath(); ctx.moveTo(0,cvs.height*.5);
    for(let x=0;x<=cvs.width;x+=4){
      const y=cvs.height*.5+Math.sin(x*frq+lp)*la+Math.sin(x*frq*1.8+lp*1.3)*(la*.3);
      ctx.lineTo(x,y);
    }
    ctx.strokeStyle=l===0?c1:c2; ctx.lineWidth=2-l*.4; ctx.globalAlpha=al; ctx.stroke();
  }
  ctx.globalAlpha=1; requestAnimationFrame(draw);
}
draw();

document.getElementById('star-emoji').textContent = data.emoji;
document.getElementById('star-name').textContent = starName + '星';
document.getElementById('star-subtitle').textContent = `命宮 · ${data.alias}`;
document.title = starName + '星坐命｜紫微斗數 × 莫子觀點';

// 鏡子兩層
document.getElementById('mirror-layer1').textContent = data.mirror.layer1;
document.getElementById('mirror-layer2').textContent = data.mirror.layer2;

// 特質標籤
document.getElementById('traits-grid').innerHTML =
  data.tags.map(t => `<div class="trait-pill">${t}</div>`).join('');

// 波形顏色跟著主星
curHz = 350;

// 解鎖按鈕帶入所有參數（付費頁需要）
const unlockBtn = document.querySelector('.unlock-btn');
if(unlockBtn){
  const allParams = new URLSearchParams(window.location.search);
  unlockBtn.href = 'result-paid.html?' + allParams.toString();
}

// CTA 模組（從 CTA_CONFIG 動態渲染，inactive 的不顯示）
const ctaCourses = document.getElementById('cta-courses');
const activeCTAs = [CTA_CONFIG.primary, CTA_CONFIG.secondary].filter(c => c.active);

if(activeCTAs.length === 0){
  document.getElementById('bottom-cta').style.display = 'none';
} else {
  const btnClasses = ['course-btn-a', 'course-btn-b'];
  ctaCourses.innerHTML = activeCTAs.map((c, i) => {
    const couponHtml = c.coupon
      ? `<span style="display:block;font-size:10px;opacity:.7;margin-top:2px;">優惠碼 ${c.coupon.code}</span>`
      : '';
    return `<a class="course-btn ${btnClasses[i]||'course-btn-b'}" href="${c.url}" target="_blank" rel="noopener">
      ${c.title}${couponHtml}
    </a>`;
  }).join('');
}

document.getElementById('hz-deco').textContent = starName + '星';
</script>
</body>
