<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完整命盤｜紫微斗數 × 莫子觀點</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#07070f;
  color:#e8e8f0;
  font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:180px;
}
#wave-canvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  z-index:0; pointer-events:none; opacity:.15;
}
.page {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  align-items:center;
  padding:48px 20px 40px;
}
.back-link {
  align-self:flex-start; max-width:520px; width:100%;
  margin-bottom:24px;
}
.back-link a {
  font-size:13px; color:rgba(167,139,250,.6);
  text-decoration:none; transition:color .2s;
}
.back-link a:hover { color:rgba(167,139,250,1); }

/* ── paid badge ── */
.paid-badge-row {
  display:flex; align-items:center; gap:10px;
  width:100%; max-width:520px; margin-bottom:20px;
  justify-content:center;
}
.paid-badge {
  font-size:11px; letter-spacing:2px;
  padding:5px 14px; border-radius:8px;
  background:rgba(124,58,237,.25);
  border:1px solid rgba(124,58,237,.5);
  color:rgba(196,181,253,.9);
  text-transform:uppercase;
}

/* ── star hero ── */
.star-hero {
  width:100%; max-width:520px;
  background:rgba(124,58,237,.12);
  border:1px solid rgba(124,58,237,.4);
  border-radius:24px;
  padding:36px 28px 32px;
  text-align:center;
  margin-bottom:20px;
  position:relative; overflow:hidden;
}
.star-hero::before {
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(124,58,237,.3) 0%, transparent 70%);
  pointer-events:none;
}
.star-emoji { font-size:56px; margin-bottom:14px; display:block; line-height:1; }
.star-name {
  font-size:clamp(28px,7vw,46px); font-weight:800;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#818cf8 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px;
}
.star-subtitle { font-size:13px; color:rgba(255,255,255,.35); letter-spacing:1px; }

/* ── section card ── */
.section-card {
  width:100%; max-width:520px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:28px 24px;
  margin-bottom:14px;
}
.section-card.accent {
  border-color:rgba(124,58,237,.25);
  background:rgba(124,58,237,.06);
}
.section-label {
  font-size:11px; letter-spacing:2.5px;
  color:rgba(167,139,250,.6);
  text-transform:uppercase; margin-bottom:12px;
}
.section-body {
  font-size:14px; color:rgba(255,255,255,.58);
  line-height:1.9; white-space:pre-line;
}
.section-body strong { color:rgba(196,181,253,.85); font-weight:600; }

/* layer2 style */
.layer2-block {
  margin-top:20px;
  border-left:3px solid rgba(124,58,237,.5);
  padding:16px 18px;
  background:rgba(124,58,237,.07);
  border-radius:0 12px 12px 0;
  font-size:14px; color:rgba(196,181,253,.7);
  line-height:1.9; white-space:pre-line;
}

/* traits */
.traits-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; margin-top:18px;
}
.trait-pill {
  background:rgba(124,58,237,.1);
  border:1px solid rgba(124,58,237,.25);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px; color:rgba(196,181,253,.8);
  text-align:center;
}

/* palace hint */
.palace-hint-block {
  margin-top:16px;
  font-size:13px; color:rgba(255,255,255,.3);
  line-height:1.75; text-align:center;
  font-style:italic;
}

/* section divider */
.section-divider {
  width:100%; max-width:520px;
  margin:8px 0 20px;
  display:flex; align-items:center; justify-content:center;
  gap:12px;
}
.section-divider::before, .section-divider::after {
  content:''; flex:1;
  height:1px; background:rgba(255,255,255,.06);
}
.divider-label {
  font-size:11px; letter-spacing:2px;
  color:rgba(255,255,255,.2);
  text-transform:uppercase;
  white-space:nowrap;
}

/* ── 12 宮 grid ── */
.palace-grid {
  display:flex; flex-direction:column; gap:12px;
  width:100%; max-width:520px; margin-bottom:14px;
}
.palace-card {
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  padding:20px 20px 18px;
  transition:border-color .2s;
}
.palace-card:hover { border-color:rgba(124,58,237,.3); }
.palace-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.palace-name-wrap {
  display:flex; align-items:center; gap:8px;
}
.palace-icon { font-size:18px; }
.palace-name {
  font-size:15px; font-weight:700;
  color:rgba(196,181,253,.9);
}
.palace-star-tag {
  font-size:12px; color:rgba(124,58,237,.9);
  background:rgba(124,58,237,.12);
  border:1px solid rgba(124,58,237,.25);
  border-radius:6px; padding:3px 10px;
  white-space:nowrap;
}
.palace-domain {
  font-size:11px; letter-spacing:1.5px;
  color:rgba(255,255,255,.2);
  text-transform:uppercase;
  margin-bottom:10px;
}
.palace-body {
  font-size:13px; color:rgba(255,255,255,.48);
  line-height:1.85;
}

/* loading state */
.loading-text {
  font-size:13px; color:rgba(255,255,255,.2);
  text-align:center; padding:20px 0;
}

/* ── sticky bottom CTA ── */
.bottom-cta {
  position:fixed; bottom:0; left:0; right:0;
  z-index:10;
  background:rgba(7,7,15,.92);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.08);
  padding:14px 20px 28px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.cta-label {
  font-size:11px; letter-spacing:2px;
  color:rgba(167,139,250,.5); text-transform:uppercase;
}
.cta-main-btn {
  display:block; width:100%; max-width:480px;
  padding:15px 20px;
  background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);
  color:#fff; font-size:15px; font-weight:700;
  border-radius:14px; text-decoration:none; text-align:center;
  letter-spacing:.5px;
  box-shadow:0 4px 24px rgba(124,58,237,.4);
  transition:transform .2s, box-shadow .2s;
}
.cta-main-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(124,58,237,.6); }
.cta-coupon {
  font-size:11px; color:rgba(196,181,253,.4);
  letter-spacing:1px; text-align:center;
}

.hz-deco {
  position:fixed; bottom:120px; right:20px;
  font-size:11px; letter-spacing:2px;
  color:rgba(255,255,255,.08);
  pointer-events:none; z-index:0;
}
</style>
</head>

這就是命盤的真正用途。

const PALACE_STAR_CONTENT = {

  '兄弟宮': {
    icon: '🤝', domain: '平輩關係 · 資源共享',
    stars: {
      '紫微': `你在手足和同輩中，往往自然地站到核心位置——別人找你、依賴你、把你當成標準。但這份中心感也帶來了一種難以言說的孤立：你很難真正「只是其中一個人」。潛意識模式：需要被尊重，才能放鬆地和他們在一起。`,
      '天機': `你在平輩中是點子最多的人，也是最容易改變計畫的人。合作往往因你的靈活而難以收尾。與手足之間可能因思路和節奏不同，而有一種說不清的距離感。`,
      '太陽': `你在兄弟姐妹中往往是付出最多的那一個。你有沒有算過，你給出去了多少，又收回了什麼？那份說不出口的「為什麼只有我在付出」，可能已經悶了很久了。`,
      '武曲': `你與手足或同輩的關係偏向務實——有事一起做，但情感交流不多。你們之間的連結更像是「戰友」，而不是在一起就可以放鬆的人。`,
      '天同': `你與手足或同輩之間關係輕鬆，不太有衝突，但也缺少深度。你習慣用「沒事、還好」維持表面的和諧，而心裡真正想說的，不一定說得出口。`,
      '廉貞': `你與兄弟姐妹或同輩之間的關係，要嘛非常親密，要嘛有明顯的是非。中間地帶很少。這段關係帶給你強烈的情緒波動，愛恨都比別人的濃。`,
      '天府': `你在平輩中是最穩、最可靠的人。大家有事找你，你也習慣扛起責任。但這讓你默默累積了很多「為什麼只有我要負責」的隱性怨氣。`,
      '太陰': `你與手足的關係細膩而敏感，能感受到他們情緒的細微變化。但這份敏感也讓你容易在這段關係裡受傷——有時候是不小心說的一句話，就能讓你難受很久。`,
      '貪狼': `你在平輩中很有魅力，交際能力強，但深度承諾和長期支持對你來說有時是挑戰。你喜歡這段關係熱鬧而自由，不喜歡被義務綁住。`,
      '巨門': `你與兄弟姐妹或同輩之間容易有口舌是非或誤會。你說話直接、有力，但說出去的話常常比你以為的更傷人，留下了你自己可能沒有意識到的裂縫。`,
      '天相': `你在平輩中是天然的協調者——有人有矛盾，都找你說話。但你在這段關係中常常忘了問自己：我真正的立場是什麼？我需要什麼？`,
      '天梁': `你在手足或同輩中往往是最成熟、最有智慧的那一個，大家把你當長者一樣請教。但這讓你在這段關係裡難以真正「平輩」相處，很少有人把你當一個也需要被支持的人。`,
      '七殺': `你與手足或同輩的關係獨立而疏離。你不依賴他們，也不需要他們常常出現。各自獨立是你最舒服的模式，但有時候你也想知道：如果我需要的時候，有人可以在嗎？`,
      '破軍': `你與兄弟姐妹或同輩的關係經歷過明顯的波動，甚至決裂或重建。這些起伏讓你學會了很多，但也讓你在進入平輩關係時，保持著一種「不完全信任」的防衛距離。`,
      '': `兄弟宮空宮，代表這段關係在你的生命藍圖裡相對淡薄。你習慣獨自面對，不太依賴手足或同輩的支持。這不是缺憾，而是你這一世選擇了從其他方向學習關係課題。`
    }
  },

  '夫妻宮': {
    icon: '💑', domain: '親密關係 · 伴侶模式',
    stars: {
      '紫微': `夫妻宮紫微，你在親密關係中往往是那個掌方向盤的人，或者你吸引的伴侶是有地位感、讓你有所依的人。你在關係裡需要被尊重，一旦感覺被輕視，就很難放下。潛意識信念：「我值得一段有尊嚴的愛情。」但有時這份對被看見的渴望，讓你把控制當成了愛。`,
      '天機': `夫妻宮天機，你在關係中很動腦——想太多、分析太多。情感本來是感受的，你卻常常把它變成了解題。你的伴侶有時會說：你到底有沒有在感覺？`,
      '太陽': `夫妻宮太陽，你在關係中是那個發光給溫暖的人，你給予、你照顧、你付出。但這份光有時候變成了一種隱形的控制——因為你需要伴侶也在你的光裡，你才安心。你有沒有想過：你也可以接受別人照耀你？`,
      '武曲': `夫妻宮武曲，你用行動表達愛，而不是語言。對你來說，「我幫你做」就是「我愛你」。但你的伴侶可能需要被說出來的愛，而不只是被照顧到的事。情感溝通，是這段關係最需要的功課。`,
      '天同': `夫妻宮天同，你渴望輕鬆、沒有壓力的關係。你迴避衝突，即使有話說不清楚，你也寧願跳過。但那些說不清楚的，不會消失——它們在關係的底層慢慢積累，等到某一天突然爆炸。`,
      '廉貞': `夫妻宮廉貞，你的愛情強烈而全力以赴。你愛的時候義無反顧，不愛了也可以切得乾淨。這份強度讓你的愛情充滿張力，但也讓關係容易走向極端——非常好或非常壞，很少有平靜的中間地帶。`,
      '天府': `夫妻宮天府，你在關係中是那個穩定的基石，你保護、你給安全感、你負責任。但過度的穩定有時讓關係失去活力，你的伴侶可能渴望你也能有一些衝動和驚喜。`,
      '太陰': `夫妻宮太陰，你在親密關係中極度敏感——伴侶一個眼神、一個語氣，你都能接收到。這是細膩，也是脆弱。你常常在沒有人說什麼的時候，就已經感覺到了某種距離，然後開始默默難過。`,
      '貪狼': `夫妻宮貪狼，你的伴侶往往魅力十足，或者你在關係早期被強烈的吸引力驅動。但你有時候愛上的是那個「感覺」，而不完全是那個人。當感覺消退，你開始覺得不夠，然後尋找下一個刺激點。`,
      '巨門': `夫妻宮巨門，口舌是你的關係裡最大的危機。你說話直接、犀利，而你最在乎的人，也最容易被你不小心說出口的話傷到。你不是故意的，但說出去的話無法收回。學習「說之前停一秒」是這段關係送給你的課題。`,
      '天相': `夫妻宮天相，你是很好的伴侶——體貼、周到、願意為對方付出。但你常常忘了問自己：我在這段關係裡，想要的是什麼？你太習慣成全對方，有時候連自己的需求都說不清楚了。`,
      '天梁': `夫妻宮天梁，你在親密關係中往往是照顧者的角色——你有智慧、你給穩定、你幫伴侶解決問題。但這讓你難以被照顧、被心疼。你有多久，沒有讓伴侶看見你也需要被支持了？`,
      '七殺': `夫妻宮七殺，你的伴侶需要夠強才能和你並肩——你不喜歡軟弱的對方，也不允許自己在關係中示弱。但這份「強強聯手」的期待，讓你在最脆弱的時候，還是選擇一個人撐著，不讓伴侶看見你需要被扶一把。`,
      '破軍': `夫妻宮破軍，你的感情路往往大起大落。每一段深刻的關係，都讓你的某個部分徹底改變，甚至讓你重新認識自己。這些震盪是代價，也是禮物——你比大多數人更清楚，真實的愛情是什麼樣子。`,
      '': `夫妻宮空宮，代表你在親密關係中的模式，更多由其他宮位的星決定。空宮不代表孤獨，而是說這段關係在你的靈魂課題裡，需要你主動去創造和選擇，而不是等待命定的安排。`

  '子女宮': {
    icon: '🌱', domain: '創造力 · 作品 · 孩子關係',
    stars: {
      '紫微': `你的創作和孩子關係中有一種主導欲——你習慣主導，你有標準，你希望看到優秀的結果。但這份對完美的要求，有時讓你和孩子（或你的創作）之間缺少了輕鬆和玩耍。`,
      '天機': `你和孩子的互動充滿智識交流，你的創造力多變靈活，點子不斷。但你的作品和計畫也常常因為太多靈感而難以完成——「完成一件事」是這個宮位給你的功課。`,
      '太陽': `你對孩子慷慨而有光，你的陪伴是孩子最大的溫暖來源。但你有時付出太多，把自己燃燒掉了，反而讓孩子不知道怎麼消化你給的這份重量。`,
      '武曲': `你對孩子的愛很實際——你確保他們有所需要的，你負責任、你執行。但情感的部分不是你的強項，孩子可能感受到你的用心，卻少了一些被說出來的溫柔。`,

//  Canvas wave
// ═══════════════════════════════════════════════
const cvs = document.getElementById('wave-canvas');
const ctx = cvs.getContext('2d');
let ph = 0, curHz = 500;
function resize(){ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
function lerpC(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&255,ag=(ah>>8)&255,ab=ah&255;
  const br=(bh>>16)&255,bg=(bh>>8)&255,bb=bh&255;
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}
function draw(){
  const t=Math.max(0,Math.min(1,(curHz-20)/980));
  const spd=.3+t*2.5,amp=40+t*60,frq=.003+t*.009;
  ph+=spd*.012;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const c1=lerpC('#1a0050','#3a10a0',t),c2=lerpC('#001040','#103080',t);
  for(let l=0;l<3;l++){
    const lp=ph+(l*Math.PI*.6),la=amp*(1-l*.25),al=.55-l*.13;
    ctx.beginPath(); ctx.moveTo(0,cvs.height*.5);
    for(let x=0;x<=cvs.width;x+=4){
      const y=cvs.height*.5+Math.sin(x*frq+lp)*la+Math.sin(x*frq*1.8+lp*1.3)*(la*.3);
      ctx.lineTo(x,y);
    }
    ctx.strokeStyle=l===0?c1:c2; ctx.lineWidth=2-l*.4; ctx.globalAlpha=al; ctx.stroke();
  }
  ctx.globalAlpha=1; requestAnimationFrame(draw);
}
draw();

const HOUR_INDEX = { 子:0,丑:1,寅:2,卯:3,辰:4,巳:5,午:6,未:7,申:8,酉:9,戌:10,亥:11 };

const PALACE_ORDER = [
  '兄弟宮','夫妻宮','子女宮','財帛宮','疾厄宮',
  '遷移宮','交友宮','事業宮','田宅宮','福德宮','父母宮'
];

// iztro 使用「官祿宮」，我們顯示「事業宮」
const IZTRO_NAME = { '事業宮': '官祿宮' };

async function buildPalaceGrid() {
  const grid = document.getElementById('palace-grid');
  let palaceStars = {};

  if (year && month && day && hour && gender) {
    try {
      const { astro } = await import('https://esm.sh/iztro@2.4.0');
      const dateStr = `${year}/${month}/${day}`;
      const timeIdx = HOUR_INDEX[hour] ?? 0;
      const g = gender === 'male' ? '男' : '女';
      const astrolabe = astro.bySolar(dateStr, timeIdx, g, true, 'zh-TW');

      for (const pName of PALACE_ORDER) {
        const iztroKey = IZTRO_NAME[pName] || pName;
        const palace = astrolabe.palace(iztroKey);
        const mainStars = (palace?.majorStars || [])
          .filter(s => s.type === 'major')
          .map(s => s.name.replace('星',''));
        palaceStars[pName] = mainStars;
      }
    } catch(err) {
      console.warn('iztro error, using fallback', err);
    }
  }

  // render cards
  grid.innerHTML = '';
  for (const pName of PALACE_ORDER) {
    const content = PALACE_STAR_CONTENT[pName];
    if (!content) continue;

    const stars = palaceStars[pName] || [];
    const primaryStar = stars[0] || '';
    const starText = stars.length > 0
      ? stars.join('、') + '星'
      : '空宮';

    const bodyText = content.stars[primaryStar]
      || content.stars['']
      || `${pName}的解讀將根據你的命盤計算後呈現。`;

    const card = document.createElement('div');
    card.className = 'palace-card';
    card.innerHTML = `
      <div class="palace-header">
        <div class="palace-name-wrap">
          <span class="palace-icon">${content.icon}</span>
          <span class="palace-name">${pName}</span>
        </div>
        <span class="palace-star-tag">${starText}</span>
      </div>
      <p class="palace-domain">${content.domain}</p>
      <p class="palace-body">${bodyText}</p>
    `;
    grid.appendChild(card);
  }
}

buildPalaceGrid();
</script>
</body>
</html>
