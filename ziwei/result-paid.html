<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完整命盤｜紫微斗數 × 莫子觀點</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#07070f;
  color:#e8e8f0;
  font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:180px;
}
#wave-canvas {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  z-index:0; pointer-events:none; opacity:.15;
}
.page {
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  align-items:center;
  padding:48px 20px 40px;
}
.back-link {
  align-self:flex-start; max-width:520px; width:100%;
  margin-bottom:24px;
}
.back-link a {
  font-size:13px; color:rgba(167,139,250,.6);
  text-decoration:none; transition:color .2s;
}
.back-link a:hover { color:rgba(167,139,250,1); }

/* ── paid badge ── */
.paid-badge-row {
  display:flex; align-items:center; gap:10px;
  width:100%; max-width:520px; margin-bottom:20px;
  justify-content:center;
}
.paid-badge {
  font-size:11px; letter-spacing:2px;
  padding:5px 14px; border-radius:8px;
  background:rgba(124,58,237,.25);
  border:1px solid rgba(124,58,237,.5);
  color:rgba(196,181,253,.9);
  text-transform:uppercase;
}

/* ── star hero ── */
.star-hero {
  width:100%; max-width:520px;
  background:rgba(124,58,237,.12);
  border:1px solid rgba(124,58,237,.4);
  border-radius:24px;
  padding:36px 28px 32px;
  text-align:center;
  margin-bottom:20px;
  position:relative; overflow:hidden;
}
.star-hero::before {
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(124,58,237,.3) 0%, transparent 70%);
  pointer-events:none;
}
.star-emoji { font-size:56px; margin-bottom:14px; display:block; line-height:1; }
.star-name {
  font-size:clamp(28px,7vw,46px); font-weight:800;
  background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#818cf8 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px;
}
.star-subtitle { font-size:13px; color:rgba(255,255,255,.35); letter-spacing:1px; }

/* ── section card ── */
.section-card {
  width:100%; max-width:520px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:28px 24px;
  margin-bottom:14px;
}
.section-card.accent {
  border-color:rgba(124,58,237,.25);
  background:rgba(124,58,237,.06);
}
.section-label {
  font-size:11px; letter-spacing:2.5px;
  color:rgba(167,139,250,.6);
  text-transform:uppercase; margin-bottom:12px;
}
.section-body {
  font-size:14px; color:rgba(255,255,255,.58);
  line-height:1.9; white-space:pre-line;
}
.section-body strong { color:rgba(196,181,253,.85); font-weight:600; }

/* layer2 style */
.layer2-block {
  margin-top:20px;
  border-left:3px solid rgba(124,58,237,.5);
  padding:16px 18px;
  background:rgba(124,58,237,.07);
  border-radius:0 12px 12px 0;
  font-size:14px; color:rgba(196,181,253,.7);
  line-height:1.9; white-space:pre-line;
}

/* traits */
.traits-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; margin-top:18px;
}
.trait-pill {
  background:rgba(124,58,237,.1);
  border:1px solid rgba(124,58,237,.25);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px; color:rgba(196,181,253,.8);
  text-align:center;
}

/* palace hint */
.palace-hint-block {
  margin-top:16px;
  font-size:13px; color:rgba(255,255,255,.3);
  line-height:1.75; text-align:center;
  font-style:italic;
}

/* section divider */
.section-divider {
  width:100%; max-width:520px;
  margin:8px 0 20px;
  display:flex; align-items:center; justify-content:center;
  gap:12px;
}
.section-divider::before, .section-divider::after {
  content:''; flex:1;
  height:1px; background:rgba(255,255,255,.06);
}
.divider-label {
  font-size:11px; letter-spacing:2px;
  color:rgba(255,255,255,.2);
  text-transform:uppercase;
  white-space:nowrap;
}

/* ── 12 宮 grid ── */
.palace-grid {
  display:flex; flex-direction:column; gap:12px;
  width:100%; max-width:520px; margin-bottom:14px;
}
.palace-card {
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  padding:20px 20px 18px;
  transition:border-color .2s;
}
.palace-card:hover { border-color:rgba(124,58,237,.3); }
.palace-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.palace-name-wrap {
  display:flex; align-items:center; gap:8px;
}
.palace-icon { font-size:18px; }
.palace-name {
  font-size:15px; font-weight:700;
  color:rgba(196,181,253,.9);
}
.palace-star-tag {
  font-size:12px; color:rgba(124,58,237,.9);
  background:rgba(124,58,237,.12);
  border:1px solid rgba(124,58,237,.25);
  border-radius:6px; padding:3px 10px;
  white-space:nowrap;
}
.palace-domain {
  font-size:11px; letter-spacing:1.5px;
  color:rgba(255,255,255,.2);
  text-transform:uppercase;
  margin-bottom:10px;
}
.palace-body {
  font-size:13px; color:rgba(255,255,255,.48);
  line-height:1.85;
}

/* loading state */
.loading-text {
  font-size:13px; color:rgba(255,255,255,.2);
  text-align:center; padding:20px 0;
}

/* ── sticky bottom CTA ── */
.bottom-cta {
  position:fixed; bottom:0; left:0; right:0;
  z-index:10;
  background:rgba(7,7,15,.92);
  backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.08);
  padding:14px 20px 28px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.cta-label {
  font-size:11px; letter-spacing:2px;
  color:rgba(167,139,250,.5); text-transform:uppercase;
}
.cta-main-btn {
  display:block; width:100%; max-width:480px;
  padding:15px 20px;
  background:linear-gradient(135deg,#7c3aed 0%,#5b21b6 100%);
  color:#fff; font-size:15px; font-weight:700;
  border-radius:14px; text-decoration:none; text-align:center;
  letter-spacing:.5px;
  box-shadow:0 4px 24px rgba(124,58,237,.4);
  transition:transform .2s, box-shadow .2s;
}
.cta-main-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(124,58,237,.6); }
.cta-coupon {
  font-size:11px; color:rgba(196,181,253,.4);
  letter-spacing:1px; text-align:center;
}

.hz-deco {
  position:fixed; bottom:120px; right:20px;
  font-size:11px; letter-spacing:2px;
  color:rgba(255,255,255,.08);
  pointer-events:none; z-index:0;
}

/* ── 四化標籤 ── */
.hua-tag {
  display:inline-flex; align-items:center; gap:4px;
  font-size:11px; padding:2px 8px; border-radius:6px;
  margin-left:6px;
}
.hua-lu { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3); color:#86efac; }
.hua-quan { background:rgba(59,130,246,.12); border:1px solid rgba(59,130,246,.3); color:#93c5fd; }
.hua-ke { background:rgba(234,179,8,.12); border:1px solid rgba(234,179,8,.3); color:#fde68a; }
.hua-ji { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }

.hua-note {
  margin-top:10px;
  font-size:12px; line-height:1.75;
  padding:8px 12px;
  border-radius:8px;
}
.hua-note-lu { background:rgba(34,197,94,.06); color:rgba(134,239,172,.7); }
.hua-note-quan { background:rgba(59,130,246,.06); color:rgba(147,197,253,.7); }
.hua-note-ke { background:rgba(234,179,8,.06); color:rgba(253,230,138,.7); }
.hua-note-ji { background:rgba(239,68,68,.08); color:rgba(252,165,165,.8); }

/* ── 煞星 / 助星標籤 ── */
.minor-stars-row {
  display:flex; flex-wrap:wrap; gap:6px;
  margin-top:12px;
}
.sha-tag {
  display:inline-flex; align-items:center; gap:3px;
  font-size:11px; padding:2px 8px; border-radius:6px;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.2);
  color:rgba(252,165,165,.75);
}
.zhu-tag {
  display:inline-flex; align-items:center; gap:3px;
  font-size:11px; padding:2px 8px; border-radius:6px;
  background:rgba(234,179,8,.07);
  border:1px solid rgba(234,179,8,.2);
  color:rgba(253,230,138,.75);
}
.minor-note {
  margin-top:8px;
  font-size:12px; line-height:1.75;
  padding:8px 12px; border-radius:8px;
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.35);
}
</style>
</head>

  <div class="section-card" style="margin-bottom:20px;">

這張命盤不是你的宿命書，是你的潛意識地圖。

每一個宮位裡的星，都代表你在那個生命領域裡，帶進來的<strong>慣性劇本</strong>。

看見它，不是為了接受它——而是為了在下一次它啟動的瞬間，你能暫停一秒，選擇不同的回應。

這就是命盤的真正用途。
    </p>

</div>

<!-- Sticky Bottom CTA -->
<div class="bottom-cta" id="bottom-cta" style="display:none;">

</div>

<script>
// ═══════════════════════════════════════════════
//  流年宮位詮釋（12 宮 × 莫子觀點）
// ═══════════════════════════════════════════════
const YEARLY_CONTENT = {
  '命宮': {
    keyword: '自我覺醒',
    body: `流年命宮，今年你自己就是主角。這一年的事件，幾乎都會直接觸碰到你的核心自我——你是誰、你要什麼、你如何看待自己。\n\n今年特別容易出現「讓你重新認識自己」的時刻：可能是一個機會、一次考驗，或者一段關係的改變，讓你看見自己以前沒有看見的部分。\n\n莫子說：流年命宮是靈魂把課題擺在正面的一年——你無法繞開，只能面對。配合大限的背景，今年的事件往往是你這整個十年課題的「縮影」。`
  },
  '兄弟宮': {
    keyword: '合作與資源',
    body: `流年行至兄弟宮，今年的能量場圍繞著「合作、平輩關係和資源流動」展開。\n\n今年你容易在同事、合夥人、手足或同齡友人身上，遇到值得深入的機會或考驗。如果有合作計畫在今年談，成功率比其他時候高。但也要注意：資源共享的地方，也是是非容易產生的地方。\n\n今年的觸發點：留意身邊平輩的動態，他們的動向和你的運勢直接相關。有人能成為你的助力——你需要主動去靠近。`
  },
  '夫妻宮': {
    keyword: '親密關係',
    body: `流年行至夫妻宮，今年感情和親密關係是你最活躍的課題。不管你現在的狀態是什麼，這一年的事件往往會直接碰觸到你對「親密連結」的信念。\n\n單身的人，今年的桃花能量比較旺，容易有值得認真的相遇。已有伴侶的人，這一年是關係深化（或重新校正）的重要節點。\n\n今年的觸發點：你的伴侶（或讓你心動的人），是今年最精準的命盤鏡子。他們讓你有強烈感受的事，往往是你自己最需要看清楚的東西。`
  },
  '子女宮': {
    keyword: '創造與表達',
    body: `流年行至子女宮，今年的能量往「創造、作品和表達」流動。這一年你特別容易有創作的衝動，或者一個想要「生出什麼東西」的強烈念頭——可能是一個作品、一個計畫、一個品牌，或者真的是迎接新生命。\n\n今年也是你和孩子（或年輕一代）關係最活躍的一年。如果你是創作者或教育者，今年的狀態比平時更有能量、更容易找到受眾。\n\n今年的觸發點：有沒有一件你一直想做但一直拖著的創作？今年是開始的好時機。`
  },
  '財帛宮': {
    keyword: '財富流動',
    body: `流年行至財帛宮，今年的金錢能量比平時活躍。這一年容易有意想不到的財務機會，或者收入結構上的重要變化。\n\n但財帛宮流年同時也是「考你的金錢信念」的一年——你對豐盛的態度，今年會被放大。如果你對錢有很多恐懼或限制性信念，今年這些東西容易以實際的財務事件呈現出來。\n\n今年的觸發點：注意今年在財務上出現的「出乎意料」，不管是意外之財還是意外的支出，都有東西可以看。配合四化的方向，會更清楚這一年錢在哪裡流動。`
  },
  '疾厄宮': {
    keyword: '身體與能量',
    body: `流年行至疾厄宮，今年你的身體和能量狀態特別值得關注。這一年身體的訊號比較明顯——不是說你會生病，而是說你的身體會更直接地告訴你：你的能量在哪裡用對了，在哪裡用錯了。\n\n今年如果出現持續的疲憊、特定部位的不舒服，先別只往醫療方向走——問問自己：我最近有什麼情緒一直沒有流動？有什麼事讓我每天醒來都覺得沉？\n\n今年的觸發點：把身體的狀態當作指南針，而不是麻煩。今年最好的投資，是好好照顧你的能量系統。`
  },
  '遷移宮': {
    keyword: '外部世界',
    body: `流年行至遷移宮，今年的能量往「外部世界、移動、陌生環境」流動。這一年出外的機會多、變動的頻率高，容易有跨城市、跨領域，甚至跨國的機緣出現。\n\n遷移宮流年也是今年「在外闖蕩」最有能量的時候——如果你有想要拓展的計畫，今年走出去的效果會比留在原地強。\n\n今年的觸發點：如果有一個機會需要你「離開熟悉的地方」，今年比其他年份更值得認真考慮。流年遷移宮的人，往往發現最重要的事，發生在他們離開舒適圈之後。`

  '交友宮': {

  },
  '田宅宮': {

    body: `流年行至田宅宮，今年「家」和「根基」相關的事件容易浮出台面。可能是住所的異動（搬家、購屋、裝修），也可能是家庭關係出現重要的轉化節點。\n\n田宅宮流年也是你今年「需要往回看原生家庭」的訊號——有時候是因為家人的狀況，有時候是因為你自己突然想起一些舊的東西。\n\n今年的觸發點：今年在「家」這件事上投入的能量，都不會白費。如果你一直想要改善居住空間或家庭關係，今年是好時機。`
  },
  '福德宮': {
    keyword: '內心與靈性',
    body: `流年行至福德宮，今年你的內心世界和精神狀態特別敏感，也特別需要被滋養。這一年你可能對靈性、冥想、心理成長，或者「生命的意義是什麼」這類問題，比平時更有共鳴。\n\n福德宮流年也是你今年「需要好好休息」的訊號。不是身體的休息，而是精神上允許自己有空白。今年太追逐外在目標，反而容易空洞；把時間留給內在，反而會發現更清晰的方向。\n\n今年的觸發點：今年有沒有一件讓你的靈魂真正感到快樂的事？如果有，多做。如果沒有，今年就是找到它的一年。`

//  Canvas wave
// ═══════════════════════════════════════════════
const cvs = document.getElementById('wave-canvas');
const ctx = cvs.getContext('2d');
let ph = 0, curHz = 500;
function resize(){ cvs.width=window.innerWidth; cvs.height=window.innerHeight; }
window.addEventListener('resize', resize); resize();
function lerpC(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&255,ag=(ah>>8)&255,ab=ah&255;
  const br=(bh>>16)&255,bg=(bh>>8)&255,bb=bh&255;
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}
function draw(){
  const t=Math.max(0,Math.min(1,(curHz-20)/980));
  const spd=.3+t*2.5,amp=40+t*60,frq=.003+t*.009;
  ph+=spd*.012;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const c1=lerpC('#1a0050','#3a10a0',t),c2=lerpC('#001040','#103080',t);
  for(let l=0;l<3;l++){
    const lp=ph+(l*Math.PI*.6),la=amp*(1-l*.25),al=.55-l*.13;
    ctx.beginPath(); ctx.moveTo(0,cvs.height*.5);
    for(let x=0;x<=cvs.width;x+=4){
      const y=cvs.height*.5+Math.sin(x*frq+lp)*la+Math.sin(x*frq*1.8+lp*1.3)*(la*.3);
      ctx.lineTo(x,y);
    }
    ctx.strokeStyle=l===0?c1:c2; ctx.lineWidth=2-l*.4; ctx.globalAlpha=al; ctx.stroke();
  }
  ctx.globalAlpha=1; requestAnimationFrame(draw);
}
draw();

];

// iztro 使用「官祿宮」，我們顯示「事業宮」
const IZTRO_NAME = { '事業宮': '官祿宮' };

async function buildPalaceGrid() {
  const grid = document.getElementById('palace-grid');
  let palaceStars = {};

  if (year && month && day && hour && gender) {
    try {
      // 加 8 秒 timeout，避免 esm.sh 連線慢時整個 grid 卡住不渲染
      const iztroMod = await Promise.race([
        import('https://esm.sh/iztro@2.4.0'),
        new Promise((_, rej) => setTimeout(() => rej(new Error('iztro timeout')), 8000))
      ]);
      const { astro } = iztroMod;
      const dateStr = `${year}/${month}/${day}`;
      const timeIdx = HOUR_INDEX[hour] ?? 0;
      const g = gender === 'male' ? '男' : '女';
      const astrolabe = astro.bySolar(dateStr, timeIdx, g, true, 'zh-TW');

      for (const pName of PALACE_ORDER) {
        const iztroKey = IZTRO_NAME[pName] || pName;
        const palace = astrolabe.palace(iztroKey);
        const mainStars = (palace?.majorStars || [])
          .filter(s => s.type === 'major')
          .map(s => s.name.replace('星',''));
        const allStars = [
          ...(palace?.majorStars || []),
          ...(palace?.minorStars || [])
        ];
        const huaStars = allStars.filter(s => s.mutagen).map(s => ({
          name: s.name.replace('星',''),
          mutagen: s.mutagen
        }));
        // 煞星 & 助星分類
        const SHA_SET = new Set(['擎羊','陀羅','火星','鈴星','地空','地劫']);
        const ZHU_SET = new Set(['文昌','文曲','左輔','右弼','天魁','天鉞','祿存','天馬']);
        const minorNames = (palace?.minorStars || []).map(s => s.name.replace('星',''));
        const shaStars = minorNames.filter(n => SHA_SET.has(n));
        const zhuStars = minorNames.filter(n => ZHU_SET.has(n));
        palaceStars[pName] = { stars: mainStars, hua: huaStars, sha: shaStars, zhu: zhuStars };
      }

      // ── 大限計算 ──
      try {
        const currentYear = new Date().getFullYear();
        const birthYear = parseInt(year);
        const currentAge = currentYear - birthYear;

        // 逐宮檢查 decadal range
        const allPalaceKeys = ['命宮','兄弟宮','夫妻宮','子女宮','財帛宮','疾厄宮',
                               '遷移宮','交友宮','官祿宮','田宅宮','福德宮','父母宮'];
        let decadalInfo = null;

        for (const pk of allPalaceKeys) {
          const p = astrolabe.palace(pk);
          const range = p?.decadal?.range;
          if (range && currentAge >= range[0] && currentAge < range[1]) {
            const displayName = pk === '官祿宮' ? '事業宮' : pk;
            const dStars = (p.decadal?.majorStars || p.majorStars || [])
              .filter(s => s.type === 'major').map(s => s.name.replace('星',''));
            const dHua = (p.decadal?.majorStars || [])
              .filter(s => s.mutagen)
              .map(s => ({ name: s.name.replace('星',''), mutagen: s.mutagen }));
            decadalInfo = { palaceName: displayName, range, stars: dStars, hua: dHua };
            break;
          }
        }

        if (decadalInfo) {
          const content = DECADAL_CONTENT[decadalInfo.palaceName] || DECADAL_CONTENT['命宮'];
          const huaMap = { '化祿':'hua-lu','化權':'hua-quan','化科':'hua-ke','化忌':'hua-ji' };
          const huaEmoji = { '化祿':'🟢','化權':'🔵','化科':'🟡','化忌':'🔴' };

          const metaEl = document.getElementById('decadal-meta');
          metaEl.innerHTML = `
            <span class="palace-star-tag" style="font-size:13px;padding:5px 14px;">
              ${decadalInfo.palaceName}大限
            </span>
            <span style="font-size:12px;color:rgba(255,255,255,.3);">
              ${decadalInfo.range[0]}–${decadalInfo.range[1]} 歲
            </span>
            ${decadalInfo.stars.length > 0
              ? `<span class="palace-star-tag">${decadalInfo.stars.join('、')}星</span>`
              : ''}
            ${decadalInfo.hua.map(h =>
              `<span class="hua-tag ${huaMap[h.mutagen]||''}">${huaEmoji[h.mutagen]||''}${h.name}${h.mutagen}</span>`
            ).join('')}
          `;

          const themeEl = document.createElement('span');
          themeEl.style.cssText = 'font-size:11px;letter-spacing:2px;color:rgba(167,139,250,.5);text-transform:uppercase;margin-left:4px;';
          themeEl.textContent = content.theme;
          metaEl.appendChild(themeEl);

          document.getElementById('decadal-body').textContent = content.body;
          document.getElementById('decadal-section').style.display = 'block';
        }
      } catch(decErr) {
        console.warn('大限計算失敗', decErr);
      }

      // ── 流年計算 ──
      try {
        const currentYear = new Date().getFullYear();
        // 地支對照：子=0, 丑=1, ..., 亥=11（以西元4年=子年為基準）
        const yearBranches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
        const currentBranch = yearBranches[((currentYear - 4) % 12 + 12) % 12];

        let yearlyPalaceName = null;
        let yearlyStars = [];
        let yearlyHua = [];

        // 找出今年地支對應的宮位 → 即為流年命宮
        for (const pk of allPalaceKeys) {
          const p = astrolabe.palace(pk);
          if (p?.earthlyBranch === currentBranch) {
            yearlyPalaceName = pk === '官祿宮' ? '事業宮' : pk;
            yearlyStars = (p.majorStars || [])
              .filter(s => s.type === 'major')
              .map(s => s.name.replace('星',''));
            const yearlyAllStars = [...(p.majorStars||[]), ...(p.minorStars||[])];
            yearlyHua = yearlyAllStars.filter(s => s.mutagen).map(s => ({
              name: s.name.replace('星',''), mutagen: s.mutagen
            }));
            break;
          }
        }

        if (yearlyPalaceName && YEARLY_CONTENT[yearlyPalaceName]) {
          const content = YEARLY_CONTENT[yearlyPalaceName];
          const huaMap = { '化祿':'hua-lu','化權':'hua-quan','化科':'hua-ke','化忌':'hua-ji' };
          const huaEmoji = { '化祿':'🟢','化權':'🔵','化科':'🟡','化忌':'🔴' };

          document.getElementById('yearly-year').textContent = currentYear + '年';

          const yMetaEl = document.getElementById('yearly-meta');
          yMetaEl.innerHTML = `
            <span class="palace-star-tag" style="font-size:13px;padding:5px 14px;">
              流年${yearlyPalaceName}
            </span>
            <span style="font-size:12px;color:rgba(255,255,255,.3);">
              ${currentYear}年 · ${currentBranch}年
            </span>
            ${yearlyStars.length > 0
              ? `<span class="palace-star-tag">${yearlyStars.join('、')}星</span>`
              : ''}
            ${yearlyHua.map(h =>
              `<span class="hua-tag ${huaMap[h.mutagen]||''}">${huaEmoji[h.mutagen]||''}${h.name}${h.mutagen}</span>`
            ).join('')}
            <span style="font-size:11px;letter-spacing:2px;color:rgba(167,139,250,.5);margin-left:4px;">${content.keyword}</span>
          `;

          document.getElementById('yearly-body').textContent = content.body;
          document.getElementById('yearly-section').style.display = 'block';
        }
      } catch(yearlyErr) {
        console.warn('流年計算失敗', yearlyErr);
      }

      // 也收集命宮的四化
      const mingPalace = astrolabe.palace('命宮');
      if (mingPalace) {
        const mingAll = [
          ...(mingPalace.majorStars || []),
          ...(mingPalace.minorStars || [])
        ];
        const mingHua = mingAll.filter(s => s.mutagen).map(s => ({
          name: s.name.replace('星',''),
          mutagen: s.mutagen
        }));
        if (mingHua.length > 0) {
          const huaMap = { '化祿':'hua-lu', '化權':'hua-quan', '化科':'hua-ke', '化忌':'hua-ji' };
          const noteMap = {
            '化祿': (n) => `✦ ${n}化祿入命宮——這個生命領域的能量流動順暢，是你的福澤所在。`,
            '化權': (n) => `✦ ${n}化權入命宮——這個生命領域的能量特別強，你在這裡有掌控力，也要注意不要過度掌控。`,
            '化科': (n) => `✦ ${n}化科入命宮——這個生命領域容易得到貴人相助，你的才能在這裡容易被看見。`,
            '化忌': (n) => `⚠ ${n}化忌入命宮——這個生命領域需要多一份覺察，是靈魂這一世重點學習的功課。`
          };
          const mingHuaHtml = mingHua.map(h => {
            const cls = huaMap[h.mutagen] || '';
            const noteText = noteMap[h.mutagen] ? noteMap[h.mutagen](h.name) : '';
            const noteCls = cls.replace('hua-','hua-note-');
            return `<div class="hua-note ${noteCls}">${noteText}</div>`;
          }).join('');
          const subtitleEl = document.getElementById('star-subtitle');
          if (subtitleEl && mingHuaHtml) {
            subtitleEl.insertAdjacentHTML('afterend', `<div style="margin-top:12px;">${mingHuaHtml}</div>`);
          }
        }
      }
    } catch(err) {
      console.warn('iztro error, using fallback', err);
    }
  }

  // ── 煞星 / 助星 莫子語意 ──
  const MINOR_STAR_NOTE = {
    // 煞星
    '擎羊': '這個宮位帶有鋒芒——你在這裡容易衝過頭，但也有旁人沒有的勇氣和突破力。',
    '陀羅': '這個宮位容易反覆、拖延、自我糾纏——不是你不夠努力，是你需要更長的時間才能轉過來。',
    '火星': '這個宮位有突如其來的爆發能量——意外的變動可能帶來麻煩，也可能帶來意想不到的突破。',
    '鈴星': '這個宮位有暗中積累的壓力——事情不會大爆炸，但你會在某個時間點突然感覺撐不住。需要找到出口。',
    '地空': '這個宮位容易有落空感——你投入了，但結果可能不如預期。莫子說：地空是靈魂在教你「不執著於結果」的地方。',
    '地劫': '這個宮位容易有突發的破耗或意外——不一定是壞事，但你需要有彈性，不要把這裡的計畫排得太死。',
    // 助星
    '文昌': '這個宮位有文昌加持——才華、文字、考試、表達能力在這裡比較容易被看見和發揮。',
    '文曲': '這個宮位有文曲相伴——藝術感、口才、情感表達在這裡特別有能量，是你的天賦入口之一。',
    '左輔': '這個宮位有貴人在旁——你在這個生命領域裡比一般人更容易得到他人的支持和協助。',
    '右弼': '這個宮位有右弼相助——背後有人在默默撐著你，即使你感覺不到，這裡的能量是有人幫你扛的。',
    '天魁': '這個宮位有天魁貴人——在這個領域容易遇到比你年長、有資源、願意提攜你的人。',
    '天鉞': '這個宮位有天鉞貴人——在這個領域容易得到貴人的暗中相助，有時候是不知道從哪裡來的好運。',
    '祿存': '這個宮位有祿存坐守——財富和資源在這裡有一定的保護力，不容易大起大落。',
    '天馬': '這個宮位有驛馬——動、移動、變化是這個宮位的主旋律。靜下來反而讓能量卡住，走出去才能流動。'
  };

  // 四化 helper
  const HUA_CSS = { '化祿':'hua-lu', '化權':'hua-quan', '化科':'hua-ke', '化忌':'hua-ji' };
  const HUA_EMOJI = { '化祿':'🟢', '化權':'🔵', '化科':'🟡', '化忌':'🔴' };
  const HUA_NOTE_CSS = { '化祿':'hua-note-lu', '化權':'hua-note-quan', '化科':'hua-note-ke', '化忌':'hua-note-ji' };
  const HUA_NOTE_TEXT = {
    '化祿': (n, p) => `✦ ${n}化祿入此宮——這個生命領域的能量流動順暢，是你的福澤所在。`,
    '化權': (n, p) => `✦ ${n}化權入此宮——這個生命領域的能量特別強，你在這裡有掌控力，也要注意不要過度掌控。`,
    '化科': (n, p) => `✦ ${n}化科入此宮——這個生命領域容易得到貴人相助，你的才能在這裡容易被看見。`,
    '化忌': (n, p) => `⚠ ${n}化忌入此宮——這個生命領域需要多一份覺察，是靈魂這一世重點學習的功課。`
  };

  // render cards
  grid.innerHTML = '';
  for (const pName of PALACE_ORDER) {
    const content = PALACE_STAR_CONTENT[pName];
    if (!content) continue;

    const palaceData = palaceStars[pName];
    const stars = palaceData?.stars ?? (Array.isArray(palaceData) ? palaceData : []);
    const huaList = palaceData?.hua ?? [];
    const shaList = palaceData?.sha ?? [];
    const zhuList = palaceData?.zhu ?? [];

    const primaryStar = stars[0] || '';
    const starText = stars.length > 0
      ? stars.join('、') + '星'
      : '空宮';

    const bodyText = content.stars[primaryStar]
      || content.stars['']
      || `${pName}的解讀將根據你的命盤計算後呈現。`;

    // 四化標籤 HTML
    const huaTagsHtml = huaList.map(h => {
      const cls = HUA_CSS[h.mutagen] || '';
      const emoji = HUA_EMOJI[h.mutagen] || '';
      return `<span class="hua-tag ${cls}">${emoji} ${h.name}${h.mutagen}</span>`;
    }).join('');

    // 四化說明文字 HTML
    const huaNotesHtml = huaList.map(h => {
      const noteCls = HUA_NOTE_CSS[h.mutagen] || '';
      const noteText = HUA_NOTE_TEXT[h.mutagen] ? HUA_NOTE_TEXT[h.mutagen](h.name, pName) : '';
      return noteText ? `<div class="hua-note ${noteCls}">${noteText}</div>` : '';
    }).join('');

    // 煞星 / 助星標籤 HTML
    const shaTagsHtml = shaList.map(n => `<span class="sha-tag">⚡ ${n}</span>`).join('');
    const zhuTagsHtml = zhuList.map(n => `<span class="zhu-tag">✦ ${n}</span>`).join('');
    const minorRowHtml = (shaList.length + zhuList.length > 0)
      ? `<div class="minor-stars-row">${shaTagsHtml}${zhuTagsHtml}</div>` : '';

    // 煞星 / 助星注解 HTML
    const minorNotesHtml = [...shaList, ...zhuList].map(n => {
      const note = MINOR_STAR_NOTE[n];
      return note ? `<div class="minor-note">${note}</div>` : '';
    }).join('');

    const card = document.createElement('div');
    card.className = 'palace-card';
    card.innerHTML = `
      <div class="palace-header">
        <div class="palace-name-wrap">
          <span class="palace-icon">${content.icon}</span>
          <span class="palace-name">${pName}</span>
        </div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:4px;">
          <span class="palace-star-tag">${starText}</span>${huaTagsHtml}
        </div>
      </div>
      <p class="palace-domain">${content.domain}</p>
      <p class="palace-body">${bodyText}</p>
      ${huaNotesHtml}
      ${minorRowHtml}
      ${minorNotesHtml}
    `;
    grid.appendChild(card);
  }
}

buildPalaceGrid();
</script>
</body>
</html>
